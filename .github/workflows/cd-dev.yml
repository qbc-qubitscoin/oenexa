# ═══════════════════════════════════════════════════
# OENEXA™ — CD Pipeline (Deploy to Dev)
# Triggers on push to develop branch
# ═══════════════════════════════════════════════════
name: Deploy to Dev

on:
  push:
    branches: [develop]

env:
  JAVA_VERSION: '26'
  ECR_REGISTRY: ${{ secrets.AWS_ECR_REGISTRY }}
  EKS_CLUSTER: oenexa-dev-cluster
  AWS_REGION: us-east-1

jobs:
  deploy:
    name: Build & Deploy to Dev
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build all modules
        run: ./gradlew build -x test --no-daemon

      - name: Build and push Docker images
        run: |
          MODULES=(
            oenexa-api-gateway
            oenexa-identity-service
            oenexa-user-service
            oenexa-kyc-service
            oenexa-wallet-service
            oenexa-trading-service
            oenexa-matching-engine
            oenexa-payment-service
            oenexa-security-service
            oenexa-notification-service
            oenexa-reporting-service
            oenexa-audit-service
            oenexa-market-data-service
            oenexa-admin-service
            oenexa-risk-engine
            oenexa-analytics-service
            oenexa-banking-service
          )
          for MODULE in "${MODULES[@]}"; do
            echo "Building Docker image for $MODULE..."
            docker build -t $ECR_REGISTRY/$MODULE:${{ github.sha }} -t $ECR_REGISTRY/$MODULE:latest ./$MODULE
            docker push $ECR_REGISTRY/$MODULE:${{ github.sha }}
            docker push $ECR_REGISTRY/$MODULE:latest
          done

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -k kubernetes/overlays/dev/
