server:
  port: 8081

spring:
  application:
    name: oenexa-identity-service
  datasource:
    url: jdbc:mysql://localhost:3306/identity_db
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: localhost:9092
  data:
    redis:
      host: localhost
