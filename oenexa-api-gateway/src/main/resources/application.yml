server:
  port: 8080

spring:
  application:
    name: oenexa-api-gateway
  cloud:
    gateway:
      routes:
        - id: identity-service
          uri: lb://oenexa-identity-service
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@ipKeyResolver}"
        - id: user-service
          uri: lb://oenexa-user-service
          predicates:
            - Path=/api/v1/users/**
        - id: kyc-service
          uri: lb://oenexa-kyc-service
          predicates:
            - Path=/api/v1/kyc/**
        - id: wallet-service
          uri: lb://oenexa-wallet-service
          predicates:
            - Path=/api/v1/wallets/**,/api/v1/transfers/**
        - id: trading-service
          uri: lb://oenexa-trading-service
          predicates:
            - Path=/api/v1/orders/**,/api/v1/trades/**,/api/v1/margin/**,/api/v1/futures/**
        - id: payment-service
          uri: lb://oenexa-payment-service
          predicates:
            - Path=/api/v1/payments/**
        - id: notification-service
          uri: lb://oenexa-notification-service
          predicates:
            - Path=/api/v1/notifications/**
        - id: market-data-service
          uri: lb://oenexa-market-data-service
          predicates:
            - Path=/api/v1/market/**
        - id: admin-service
          uri: lb://oenexa-admin-service
          predicates:
            - Path=/api/v1/admin/**
        - id: banking-service
          uri: lb://oenexa-banking-service
          predicates:
            - Path=/api/v1/bank-accounts/**,/api/v1/beneficiaries/**
        - id: reporting-service
          uri: lb://oenexa-reporting-service
          predicates:
            - Path=/api/v1/reports/**
        - id: security-service
          uri: lb://oenexa-security-service
          predicates:
            - Path=/api/v1/security/**
        - id: risk-engine
          uri: lb://oenexa-risk-engine
          predicates:
            - Path=/api/v1/risk/**
        - id: analytics-service
          uri: lb://oenexa-analytics-service
          predicates:
            - Path=/api/v1/analytics/**
        - id: audit-service
          uri: lb://oenexa-audit-service
          predicates:
            - Path=/api/v1/audit/**
  data:
    redis:
      host: localhost
      port: 6379

resilience4j:
  circuitbreaker:
    instances:
      default:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
